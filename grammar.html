<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#667C3E"><title>Grammar Basics | Chirp English</title><style>
:root{color-scheme:light;--bg:#fff;--panel:#f2f5f7;--text:#1a2730;--sub:#52606a;--line:#d6e0e6;--accent:#667c3e}*{box-sizing:border-box}body{font:15px/1.75 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);margin:0}.wrap{max-width:720px;margin:auto;padding:20px 16px 80px}h1{font-size:26px;margin:10px 0}h2{font-size:19px;margin:0}.sub{color:var(--sub)}a{color:var(--accent)}.back{display:inline-block;border:1px solid var(--line);color:var(--text);padding:8px 13px;border-radius:12px;text-decoration:none}.filters{padding:13px 0;background:var(--bg);position:sticky;top:0;z-index:2;border-bottom:1px solid var(--line)}input{font:inherit;width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text)}.lesson{background:var(--panel);border:1px solid var(--line);border-radius:15px;margin:14px 0;padding:16px;scroll-margin-top:108px}.lesson>summary{cursor:pointer;list-style:none}.lesson>summary::-webkit-details-marker{display:none}.num{font-size:12px;color:var(--sub)}.sentence{display:flex;flex-wrap:wrap;gap:5px;margin:15px 0 7px;font-size:17px;font-weight:650}.chunk{display:inline-block;padding:5px 8px;border-radius:7px;line-height:1.55}.subject{background:#DCEBFA;color:#203E63}.verb{background:#FCE0E4;color:#813847}.object{background:#DDF1E4;color:#28543E}.complement{background:#DDF1E4;color:#28543E}.time{background:#FFF1BF;color:#654E0D}.place{background:#FFF1BF;color:#654E0D}.modifier{background:#E9E0F5;color:#503D75}.head{background:#DCEBFA;color:#203E63}.legend{display:flex;flex-wrap:wrap;gap:9px;font-size:12px}.key{border-radius:5px;padding:2px 6px;border:1px solid #ddd}.help{background:var(--bg);border-radius:10px;padding:10px 13px;margin:12px 0}.ja{color:var(--sub);margin:4px 0}.inner{margin-top:14px;border-top:1px dashed var(--line);padding-top:11px}.note{margin:12px 0 0}.tools{display:flex;gap:8px;align-items:center;margin:13px 0}.button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px;color:var(--text);font:inherit;cursor:pointer}.plain .chunk{background:transparent;color:var(--text);padding:5px 2px}.plain .key{background:transparent!important;color:var(--text)}:focus-visible{outline:3px solid var(--accent);outline-offset:2px}@media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#111820;--panel:#202c37;--text:#eef4f9;--sub:#b5c4cd;--line:#40505c;--accent:#c0d690}}@media(max-width:420px){.sentence{font-size:16px}}
</style></head><body><div class="wrap"><a class="back" href="./lab.html">← Little English Lab</a> <a class="back" href="./index.html">🐦 Feed</a><h1>📐 Grammar Basics</h1><p class="sub">中学英語の基本から。まず「主語はどこまで？」「動詞はどれ？」を色と区切りで見てみよう。文法用の例文だけ色分けします。</p><div class="tools"><button class="button" id="toggle" aria-pressed="true">🎨 色分け ON</button><span class="sub" id="total"></span></div><div class="legend"><span class="key subject">主語</span><span class="key verb">動詞</span><span class="key object">目的語・補語</span><span class="key time">時・場所</span><span class="key modifier">説明のかたまり</span></div><div class="filters"><label for="search">🔎 文法・例文を探す</label><input id="search" type="search" placeholder="例：比較、主語、関係代名詞、can"></div><main id="lessons">読み込み中…</main><p class="sub">例文は学習用。Chirp Englishの住人と街は架空のものです。</p></div><script>
'use strict';const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let lessons=[],roles={};function segment(list){return '<div class="sentence" lang="en">'+list.map(x=>`<span class="chunk ${esc(x.role)}" title="${esc(roles[x.role]||'')}">${esc(x.text)}</span>`).join('')+'</div>';}function draw(){const q=$('search').value.toLocaleLowerCase();const filtered=lessons.filter(x=>[x.title,x.subtitle,x.note,x.example,x.translation].join(' ').toLocaleLowerCase().includes(q));$('total').textContent=`${filtered.length}/${lessons.length} レッスン`;$('lessons').innerHTML=filtered.map((x,i)=>`<details class="lesson" id="${esc(x.id)}" ${i===0&& !q?'open':''}><summary><div class="num">Lesson ${lessons.indexOf(x)+1}</div><h2>${esc(x.title)}</h2><div class="sub">${esc(x.subtitle)}</div></summary>${segment(x.segments)}<div class="ja">${esc(x.translation)}</div><div class="legend">${[...new Set(x.segments.map(s=>s.role))].map(r=>`<span class="key ${esc(r)}">${esc(roles[r]||r)}</span>`).join('')}</div>${x.innerSegments?`<div class="inner"><b>🔎 主語の中をさらに分ける</b>${segment(x.innerSegments)}<div class="sub">that 以降が the book を説明しているよ。</div></div>`:''}<p class="help">💡 ${esc(x.note)}</p></details>`).join('')||'<p>一致する文法がありません。</p>';}function openHash(){const id=decodeURIComponent(location.hash.slice(1));if(!id)return;const el=document.getElementById(id);if(el){el.open=true;requestAnimationFrame(()=>el.scrollIntoView({block:'start'}));}}fetch('./grammar.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('grammar.json HTTP '+r.status);return r.json()}).then(d=>{if(!Array.isArray(d.lessons))throw Error('Invalid lesson data');lessons=d.lessons;roles=d.roles||{};draw();openHash()}).catch(e=>{$('lessons').textContent='文法データを読み込めませんでした: '+e.message});$('toggle').onclick=()=>{const off=document.body.classList.toggle('plain');$('toggle').textContent=off?'🎨 色分け OFF':'🎨 色分け ON';$('toggle').setAttribute('aria-pressed',String(!off));};$('search').oninput=()=>{draw();openHash();};window.addEventListener('hashchange',openHash);
</script></body></html>
