<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#111922"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="robots" content="noindex"><title>Chirp English · v3.1</title>
<style>
:root{--bg:#fff;--panel:#f3f6f9;--fg:#172534;--muted:#627387;--line:#dae3ec;--accent:#147c76;--glass:rgba(255,255,255,.84);--post:#fff;--danger:#b34b57;color-scheme:light}
:root[data-theme="dark"]{--bg:#10151d;--panel:#202b37;--fg:#edf4fa;--muted:#acbbca;--line:#344353;--accent:#7adbd0;--glass:rgba(16,21,29,.84);--post:#10151d;--danger:#ffabb5;color-scheme:dark}
@media(prefers-color-scheme:dark){:root:not([data-theme]){--bg:#10151d;--panel:#202b37;--fg:#edf4fa;--muted:#acbbca;--line:#344353;--accent:#7adbd0;--glass:rgba(16,21,29,.84);--post:#10151d;--danger:#ffabb5;color-scheme:dark}}
*{box-sizing:border-box}html{background:var(--bg);scroll-behavior:smooth}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--fg);background:var(--bg);line-height:1.52}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}button:disabled{opacity:.5;cursor:default}
.app{max-width:720px;margin:auto;min-height:100dvh;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}.top{position:sticky;top:0;z-index:20;background:var(--glass);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top,0px) + 8px) 14px 9px}.titlebar{display:flex;align-items:center;justify-content:space-between;gap:8px}.titlebar h1{font-size:20px;letter-spacing:-.7px;margin:0}.subtitle{font-size:11px;color:var(--muted)}.controls{display:flex;gap:5px}.tinyBtn{border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:12px;padding:7px 9px;font-size:12px;white-space:nowrap}
.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:720px;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);background:var(--glass);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:1px solid var(--line);padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px))}.tabs button{border:0;background:none;color:var(--muted);padding:5px 1px;display:flex;flex-direction:column;gap:2px;align-items:center;font-size:10px;min-width:0}.tabs button b{font-size:20px;font-weight:500;line-height:1}.tabs button.active{color:var(--accent);font-weight:700}
.hint{padding:11px 15px;background:var(--panel);border-bottom:1px solid var(--line);color:var(--muted);font-size:12px}.post{background:var(--post);padding:15px;border-bottom:1px solid var(--line)}.author{display:flex;align-items:center;gap:10px;min-width:0}.avatar{display:grid;place-items:center;flex-shrink:0;width:43px;height:43px;border-radius:50%;font-size:24px;color:#142231}.avatar.small{width:32px;height:32px;font-size:19px}.author-name{font-weight:750;display:block;font-size:14px}.handle{font-size:12px;color:var(--muted);display:block}.author-btn{min-width:0;border:0;background:none;color:var(--fg);text-align:left;padding:0;flex:1}.text{font-size:16px;white-space:pre-wrap;overflow-wrap:anywhere;margin:10px 0}.translation{margin:9px 0;background:var(--panel);padding:10px 12px;border-left:3px solid var(--accent);border-radius:6px;font-size:14px;line-height:1.7}.actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px;align-items:center}.action{min-width:0;border:0;background:transparent;color:var(--muted);border-radius:12px;padding:9px 2px;display:flex;justify-content:center;align-items:center;gap:5px;font-size:12px;white-space:nowrap}.action .sym{font-size:18px}.action.active{color:var(--accent);background:var(--panel)}.replies{border-left:2px solid var(--line);padding-left:10px;margin-top:12px}.reply{padding:12px 0;border-top:1px solid var(--line)}.reply .text{font-size:14px;margin:7px 0}.reply .action{font-size:11px;width:max-content;padding:6px 10px;border:1px solid var(--line)}.reply .actions{display:flex}
.btn{background:var(--accent);color:var(--bg);border:0;border-radius:12px;padding:12px 14px;font-weight:750}.btn.secondary{background:var(--panel);color:var(--fg);border:1px solid var(--line)}.wide{display:block;width:calc(100% - 30px);margin:16px 15px}.pad{padding:16px}.heading{font-size:22px;margin:2px 0 10px}.muted{color:var(--muted)}.small{font-size:13px}.card{background:var(--panel);padding:15px;border-radius:15px;margin-bottom:12px;border:1px solid var(--line)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stats .card{padding:13px 6px;text-align:center}.stats strong{font-size:25px;display:block}.bar{height:11px;background:var(--line);border-radius:10px;overflow:hidden}.bar>i{height:100%;display:block;background:var(--accent)}.field{width:100%;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:11px}.empty{text-align:center;padding:40px 20px;color:var(--muted)}.people{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.person{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:12px;text-align:left;color:var(--fg);min-width:0}.person .avatar{margin-bottom:7px}.person strong{display:block}.person small{display:block;color:var(--muted)}.back{margin:12px 15px;border:0;background:none;color:var(--accent);font-weight:750;padding:5px}.bio{margin-top:10px}.choice{display:block;text-align:left;width:100%;padding:14px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:12px;margin:8px 0;font-weight:650}.choice.sel{border-color:var(--accent);background:var(--panel)}.choice-ja{padding:0 5px;color:var(--muted);font-size:13px}.event{border:1px solid var(--line);margin:12px 15px;border-radius:15px;padding:15px}.note{font-size:12px;color:var(--muted);padding:7px 0}.msg{padding:11px 13px;border-radius:13px;background:var(--panel);margin:9px 0}.msg.mine{margin-left:20%;background:#dcecf6;color:#182c3c}.notice{padding:13px;background:var(--panel);border-radius:12px;margin:10px 0}.unread-dot{color:var(--accent)}.list-row{display:flex;gap:12px;align-items:center;width:100%;background:none;border:0;border-bottom:1px solid var(--line);text-align:left;color:var(--fg);padding:14px 0}.error{margin:15px;background:#56333a;color:#fff;padding:16px;border-radius:12px}footer{text-align:center;font-size:11px;color:var(--muted);padding:20px}
@media(max-width:355px){.action{font-size:10px;gap:3px}.titlebar h1{font-size:18px}.tinyBtn{padding:7px;font-size:11px}}@media(min-width:721px){.top{padding-top:12px}}
</style></head><body><div class="app"><header class="top"><div class="titlebar"><div><h1>🐦 Chirp English</h1><div class="subtitle">A tiny world in English · Ver.3.1</div></div><div class="controls"><button id="levelBtn" class="tinyBtn" title="Reading level">🌱 Easy</button><button id="themeBtn" class="tinyBtn" title="Change color theme">◐ Auto</button></div></div></header><main id="main"><div class="empty">Loading your little world…</div></main><nav class="tabs" id="tabs"><button data-tab="feed" class="active"><b>⌂</b>Feed</button><button data-tab="dm"><b>✉</b>DMs</button><button data-tab="bookmarks"><b>♧</b>Saved</button><button data-tab="people"><b>☺</b>People</button><button data-tab="stats"><b>▥</b>Stats</button></nav></div>
<script>
'use strict';
const KEY='chirp-english-v3', OLD='chirp-english-v2',BATCH=7;
const $=id=>document.getElementById(id);
function read(key){try{return JSON.parse(localStorage.getItem(key)||'null')}catch{return null}}
const v2=read(OLD)||{};
let state=read(KEY)||{seenNormal:Array.isArray(v2.seen)?v2.seen:[],seenEasy:[],bookmarks:Array.isArray(v2.bookmarks)?v2.bookmarks:[],level:'normal',theme:'system',displayName:'Your Name',posts:[],events:{},tags:[],version:3};
for(const k of ['seenNormal','seenEasy','bookmarks','posts','tags'])if(!Array.isArray(state[k]))state[k]=[];
if(!state.events||typeof state.events!=='object')state.events={};
let feedObserver=null,viewTimers=new Map();
let normal=[],easy=[],users=[],events={},tab='feed',profileId=null,session=[],unfold=new Set(),translations=new Set(),selectedEvent=null,selection=null,timer=null,seenLoaded=false;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){console.warn('Local storage unavailable',e)}};
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const user=name=>users.find(u=>u.name===name)||{id:'unknown',name,avatar:'💬',color:'#d9e2eb',handle:'@'+name.toLowerCase().replace(/\W+/g,'_'),bio:'',location:''};
const posts=()=>state.level==='easy'?easy:normal; const seen=()=>state.level==='easy'?state.seenEasy:state.seenNormal;
const byId=id=>[...normal,...easy,...state.posts].find(p=>p.id===id);
const who=(name,size='')=>{const u=user(name);return `<span class="avatar ${size}" style="background:${esc(u.color)}" aria-hidden="true">${esc(u.avatar)}</span>`};
const author=(name,click=true)=>{const u=user(name);return `<div class="author">${who(name)}<button class="author-btn" ${click?`data-person="${esc(u.id)}"`:''}><span class="author-name">${esc(u.name)}</span><span class="handle">${esc(u.handle)}</span></button></div>`};
function postCard(p,reply=false){const id=p.id,tr=translations.has(id),open=unfold.has(id),saved=state.bookmarks.includes(id),r=p.replies||[];return `<article class="${reply?'reply':'post'}" ${reply?'':`data-feed-post="${esc(id)}"`}>${author(p.author)}<div class="text">${esc(p.text)}</div>${tr?`<div class="translation" lang="ja">${esc(p.translation)}</div>`:''}<div class="actions"><button class="action ${tr?'active':''}" data-action="translate" data-id="${esc(id)}" aria-label="${tr?'Hide':'Show'} translation"><span class="sym">🌐</span><span>${tr?'Hide':'Translate'}</span></button>${reply?'':`<button class="action ${open?'active':''}" data-action="replies" data-id="${esc(id)}" aria-label="View ${r.length} replies"><span class="sym">💬</span>${r.length}</button><button class="action ${saved?'active':''}" data-action="bookmark" data-id="${esc(id)}" aria-label="Bookmark post" aria-pressed="${saved}"><span class="sym">${saved?'🔖':'♧'}</span><span>${saved?'Saved':'Save'}</span></button>`}</div>${!reply&&open?`<div class="replies">${r.map(q=>postCard(q,true)).join('')||'<div class="small muted">No replies yet.</div>'}</div>`:''}</article>`}
function shuffle(a){const result=[...a];for(let i=result.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[result[i],result[j]]=[result[j],result[i]]}return result}
function loadMore(){const queued=new Set(session);const candidates=shuffle(posts().filter(p=>!seen().includes(p.id)&&!queued.has(p.id)));for(const p of candidates.slice(0,BATCH))session.push(p.id);render()}
// A post becomes seen after it is at least 60% visible for 1.2 continuous seconds.
// Neither preloading nor opening a profile/bookmark marks a post as seen.
function stopTracking(){if(feedObserver){feedObserver.disconnect();feedObserver=null}for(const t of viewTimers.values())clearTimeout(t);viewTimers.clear()}
function postActuallyVisible(el){if(document.visibilityState!=='visible'||tab!=='feed'||selectedEvent)return false;const r=el.getBoundingClientRect(),header=document.querySelector('.top'),nav=document.querySelector('.tabs');const top=header?header.getBoundingClientRect().bottom:0,bottom=nav?nav.getBoundingClientRect().top:innerHeight;const visible=Math.max(0,Math.min(r.bottom,bottom)-Math.max(r.top,top));return visible/Math.max(1,r.height)>=.6}
function trackFeed(){stopTracking();if(tab!=='feed'||selectedEvent)return;feedObserver=new IntersectionObserver(entries=>{for(const entry of entries){const el=entry.target,id=el.dataset.feedPost;if(!id||seen().includes(id))continue;if(entry.intersectionRatio>=.6&&postActuallyVisible(el)){if(!viewTimers.has(id)){const level=state.level;viewTimers.set(id,setTimeout(()=>{viewTimers.delete(id);if(level!==state.level||!el.isConnected||!postActuallyVisible(el)||seen().includes(id))return;seen().push(id);save();feedObserver?.unobserve(el)},1200))}}else if(viewTimers.has(id)){clearTimeout(viewTimers.get(id));viewTimers.delete(id)}}},{threshold:[0,.6,1]});document.querySelectorAll('#main [data-feed-post]').forEach(el=>{if(!seen().includes(el.dataset.feedPost))feedObserver.observe(el)})}
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopTracking();else trackFeed()});

const seenTotal=()=>new Set([...state.seenEasy,...state.seenNormal]).size;
function talkCount(name){return Object.values(state.events).filter(v=>v.done&&v.author===name).length+state.posts.filter(p=>(p.responses||[]).some(r=>r.author===name)).length}
function eventsReady(){return (events.events||[]).filter(e=>!state.events[e.id]&&seenTotal()>=e.minSeen&&talkCount(e.author)>=e.minTalk&&(!e.requires||state.events[e.requires]?.done))}
function eventList(kind){return (events.events||[]).filter(e=>e.kind===kind&&(state.events[e.id]||eventsReady().some(x=>x.id===e.id)))}
function eventHTML(e){const v=state.events[e.id],done=!!v?.done;const show=selectedEvent===e.id;return `<div class="event">${author(e.author)}<div class="text">${esc(e.prompt)}</div><button class="tinyBtn" data-action="eventtranslation" data-id="${esc(e.id)}">🌐 ${translations.has(e.id)?'Hide translation':'Show translation'}</button>${translations.has(e.id)?`<div class="translation">${esc(e.translation)}</div>`:''}${done?`<div class="msg mine">${esc(e.choices[v.index]?.en||'')}</div><div class="msg">${esc(e.choices[v.index]?.answer||'')}</div>${translations.has(e.id)?`<div class="translation">${esc(e.choices[v.index]?.answerJa||'')}</div>`:''}`:show?choiceHTML(e):`<button class="btn secondary" style="display:block;margin-top:12px" data-action="start-event" data-id="${esc(e.id)}">${e.kind==='dm'?'Open message':e.kind==='special'?'Join special story':'Join conversation'} →</button>`}</div>`}
function choiceHTML(e){return `<div class="note">Choose your reply · Tap 🌐 for a translation</div>${e.choices.map((c,i)=>`<div><button class="choice ${selection===i?'sel':''}" data-action="choose" data-index="${i}">${esc(c.en)} ${selection===i?'✓':''}</button><button class="tinyBtn" data-action="choicetrans" data-id="${esc(e.id)}-${i}">🌐</button>${translations.has(e.id+'-'+i)?`<div class="choice-ja">${esc(c.ja)}</div>`:''}</div>`).join('')}<button class="btn" style="margin-top:13px" data-action="confirm-event" data-id="${esc(e.id)}" ${selection===null?'disabled':''}>Send reply</button> <button class="btn secondary" data-action="cancel-event">Later</button>`}
function renderFeed(){const list=session.map(byId).filter(Boolean);const queued=new Set(session);const remaining=posts().filter(p=>!seen().includes(p.id)&&!queued.has(p.id)).length;const active=eventsReady().filter(e=>e.kind==='timeline'||e.kind==='special'||e.kind==='group');return `<div class="hint">${state.level==='easy'?'🌱 Short English, real conversations.':'🐦 Small stories from a fictional world.'} Tap 🌐 to translate.</div>${state.posts.length===0?`<div class="card" style="margin:12px 15px"><strong>👋 New here?</strong><p class="small muted">Choose your first post and meet a few neighbors.</p><button class="btn" data-action="intro">Write your first post →</button></div>`:''}${active.slice(0,2).map(eventHTML).join('')}${state.posts.slice().reverse().map(p=>playerPost(p)).join('')}${list.map(p=>postCard(p)).join('')}${remaining?`<button class="btn wide" data-action="more">Load more · ${remaining} unseen</button>`:`<div class="empty">${posts().some(p=>!seen().includes(p.id))?'Scroll to read the loaded posts.':'All caught up! 🎉<br>New posts can be added to JSON.'}</div>`}${state.posts.length?`<div class="pad"><button class="btn secondary" data-action="newpost">✎ Choose another post</button></div>`:''}`}
function playerPost(p){const visible=p.responses.filter(r=>Date.now()>=p.created+r.delay);return `<article class="post">${who('Your Name')}<strong style="margin-left:8px">${esc(state.displayName||'Your Name')}</strong> <span class="muted small">@yourname</span><div class="text">${esc(p.text)}</div><div class="small muted">💬 ${visible.length} / ${p.responses.length} replies</div>${visible.length?`<div class="replies">${visible.map(r=>`<div class="reply">${author(r.author)}<div class="text">${esc(r.text)}</div>${translations.has(r.id)?`<div class="translation">${esc(r.translation)}</div>`:''}<button class="tinyBtn" data-action="translate" data-id="${esc(r.id)}">🌐 ${translations.has(r.id)?'Hide translation':'Translate'}</button></div>`).join('')}</div>`:''}</article>`}
function renderDM(){const list=eventList('dm');const extra=(events.events||[]).filter(e=>(e.kind==='special'||e.kind==='group')&&state.events[e.id]);return `<div class="pad"><h2 class="heading">✉ Messages</h2><p class="muted small">Fictional friends may message you as you explore.</p>${[...list,...extra].map(eventHTML).join('')||'<div class="empty">No messages yet. Read some posts and join conversations!</div>'}</div>`}
function renderSaved(){const items=state.bookmarks.map(byId).filter(Boolean).reverse();return `<div class="pad"><h2 class="heading">🔖 Bookmarks</h2><p class="small muted">Saved posts stay here, even after you read them.</p></div>${items.map(p=>postCard(p)).join('')||'<div class="empty">Nothing saved yet.</div>'}`}
function renderPeople(){if(profileId){const u=users.find(x=>x.id===profileId);if(!u)return '';const ps=[...normal,...easy].filter(p=>p.author===u.name),reps=[...normal,...easy].flatMap(p=>(p.replies||[]).filter(r=>r.author===u.name).map(r=>({...r,source:p.text})));return `<button class="back" data-action="back-people">← All people</button><div class="pad"><div class="card" style="border-top:9px solid ${esc(u.color)}">${who(u.name)}<h2 class="heading">${esc(u.name)}</h2><div class="muted">${esc(u.handle)} · ${esc(u.location)}</div><p class="bio">${esc(u.bio)}</p><p class="small muted">${ps.length} posts · ${reps.length} replies</p></div><h3>Past posts</h3></div>${ps.map(p=>postCard(p)).join('')||'<div class="empty">No posts yet.</div>'}<div class="pad"><h3>Replies by ${esc(u.name)}</h3>${reps.slice(0,30).map(r=>`<div class="card">${esc(r.text)}<div class="small muted">Reply to: ${esc(r.source.slice(0,90))}…</div><button class="tinyBtn" data-action="translate" data-id="${esc(r.id)}">🌐 ${translations.has(r.id)?esc(r.translation):'Translate'}</button></div>`).join('')||'<div class="muted">No replies yet.</div>'}</div>`}return `<div class="pad"><h2 class="heading">☺ People</h2><p class="small muted">Meet the fictional people behind your feed.</p><div class="people">${users.map(u=>`<button class="person" data-person="${esc(u.id)}">${who(u.name)}<strong>${esc(u.name)}</strong><small>${esc(u.location)}</small></button>`).join('')}</div></div>`}
function renderStats(){let n=normal.length,e=easy.length,sn=normal.filter(p=>state.seenNormal.includes(p.id)).length,se=easy.filter(p=>state.seenEasy.includes(p.id)).length;let total=state.level==='easy'?e:n,shown=state.level==='easy'?se:sn;return `<div class="pad"><h2 class="heading">▥ Your Feed Stats</h2><div class="stats"><div class="card"><strong>${total}</strong><span class="small muted">Total</span></div><div class="card"><strong>${shown}</strong><span class="small muted">Seen</span></div><div class="card"><strong>${total-shown}</strong><span class="small muted">Unseen</span></div></div><div class="card"><strong>${state.level==='easy'?'🌱 Easy':'🐦 Normal'} progress</strong><div class="bar" style="margin:12px 0"><i style="width:${total?Math.round(shown/total*100):0}%"></i></div><span class="small muted">${shown} / ${total} read</span></div><div class="card"><h3>Reading history</h3><p class="small muted">A post counts as seen only after 1.2 seconds on screen. Resetting clears only the seen marks; bookmarks, your posts and friendships stay saved. The original v3 seen history may include posts you only loaded.</p><button class="btn secondary" data-action="reset-seen">Reset ${state.level==='easy'?'Easy':'Normal'} seen only</button></div><div class="card"><h3>Profile</h3><p class="small muted">Name is saved on this device. Your ID stays @yourname.</p><label for="playername">Display name</label><input class="field" id="playername" maxlength="30" value="${esc(state.displayName||'Your Name')}"><button class="btn secondary" style="margin-top:8px" data-action="save-name">Save name</button></div><div class="card"><h3>Appearance</h3><label for="themeSelect">Color mode</label><select class="field" id="themeSelect"><option value="system" ${state.theme==='system'?'selected':''}>System</option><option value="light" ${state.theme==='light'?'selected':''}>Light</option><option value="dark" ${state.theme==='dark'?'selected':''}>Dark</option></select><p class="small muted">Your theme and reading level stay saved in this browser.</p></div><div class="card"><h3>Save your progress</h3><button class="btn secondary" data-action="export">Export save data</button> <label class="tinyBtn" for="importFile" style="display:inline-block">Import save data</label><input type="file" id="importFile" accept="application/json,.json" style="position:absolute;width:1px;height:1px;opacity:0"><p class="small muted">Back up your choices, bookmarks and reading history. Local browser data may be erased by Safari.</p></div><div class="card"><h3>About</h3><p class="small muted">All people, posts and responses are fictional, prepared in JSON. No live AI, third-party scripts or account sign-in. Hosted on GitHub Pages.</p><p class="small muted">v3 includes ${n} Normal posts and ${e} Easy posts. Old v2 bookmarks and reading history are imported on first use.</p></div></div>`}
function renderIntro(){const e=events.intro;return `<div class="pad"><h2 class="heading">✎ Your first post</h2><p class="muted small">Choose an English post. The locals will reply one by one.</p>${e.choices.map((c,i)=>`<div class="card"><button class="choice ${selection===i?'sel':''}" data-action="choose" data-index="${i}">${esc(c.en)} ${selection===i?'✓':''}</button><button class="tinyBtn" data-action="choicetrans" data-id="intro-${i}">🌐</button>${translations.has('intro-'+i)?`<div class="choice-ja">${esc(c.ja)}</div>`:''}</div>`).join('')}<button class="btn" data-action="confirm-intro" ${selection===null?'disabled':''}>Post</button> <button class="btn secondary" data-action="cancel-event">Cancel</button></div>`}
function refreshButtons(){$('levelBtn').textContent=state.level==='easy'?'🌱 Easy':'🐦 Normal';$('themeBtn').textContent=state.theme==='dark'?'☾ Dark':state.theme==='light'?'☀ Light':'◐ Auto';if(state.theme==='system')document.documentElement.removeAttribute('data-theme');else document.documentElement.dataset.theme=state.theme;$('tabs').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab))}
function render(){stopTracking();refreshButtons();$('main').innerHTML=selectedEvent==='intro'?renderIntro():tab==='feed'?renderFeed():tab==='dm'?renderDM():tab==='bookmarks'?renderSaved():tab==='people'?renderPeople():renderStats();schedule();trackFeed()}
function setTab(t){stopTracking();tab=t;profileId=null;selectedEvent=null;selection=null;render();window.scrollTo({top:0,behavior:'instant'})}
function confirmEvent(e){if(selection===null)return;const c=e.choices[selection];state.events[e.id]={done:true,index:selection,author:e.author,at:Date.now()};if(c.tag&&!state.tags.includes(c.tag))state.tags.push(c.tag);selectedEvent=null;selection=null;save();render()}
function postChoice(){if(selection===null)return;const c=events.intro.choices[selection],id='you-'+Date.now();state.posts.push({id,text:c.en,created:Date.now(),responses:c.responses.map((r,i)=>({...r,id:id+'-r'+i}))});if(c.topic&&!state.tags.includes(c.topic))state.tags.push(c.topic);selectedEvent=null;selection=null;save();setTab('feed')}
function schedule(){if(timer)clearTimeout(timer);const next=state.posts.flatMap(p=>p.responses.map(r=>p.created+r.delay)).filter(t=>t>Date.now()).sort((a,b)=>a-b)[0];if(next)timer=setTimeout(()=>{timer=null;render()},Math.max(100,next-Date.now()+80))}
document.addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;if(b.dataset.tab){setTab(b.dataset.tab);return}if(b.dataset.person){profileId=b.dataset.person;tab='people';selectedEvent=null;render();window.scrollTo(0,0);return}const a=b.dataset.action,id=b.dataset.id;
if(a==='more'){loadMore();return}if(a==='reset-seen'){const label=state.level==='easy'?'Easy':'Normal';if(!confirm('Reset '+label+' reading history? Your bookmarks, posts and event progress will stay saved.'))return;if(state.level==='easy')state.seenEasy=[];else state.seenNormal=[];session=[];save();setTab('feed');loadMore();return}if(a==='translate'||a==='eventtranslation'||a==='choicetrans'){translations.has(id)?translations.delete(id):translations.add(id);render();return}if(a==='replies'){unfold.has(id)?unfold.delete(id):unfold.add(id);render();return}if(a==='bookmark'){state.bookmarks.includes(id)?state.bookmarks=state.bookmarks.filter(x=>x!==id):state.bookmarks.push(id);save();render();return}if(a==='back-people'){profileId=null;render();return}if(a==='intro'||a==='newpost'){selectedEvent='intro';selection=null;render();return}if(a==='choose'){selection=Number(b.dataset.index);render();return}if(a==='confirm-intro'){postChoice();return}if(a==='start-event'){selectedEvent=id;selection=null;render();return}if(a==='confirm-event'){const e=events.events.find(x=>x.id===id);if(e)confirmEvent(e);return}if(a==='cancel-event'){selectedEvent=null;selection=null;render();return}if(a==='save-name'){state.displayName=$('playername').value.trim().slice(0,30)||'Your Name';save();render();return}if(a==='export'){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='chirp-save.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1200);return}
});
$('levelBtn').addEventListener('click',()=>{stopTracking();state.level=state.level==='easy'?'normal':'easy';session=[];unfold.clear();save();setTab('feed');if(posts().some(p=>!seen().includes(p.id)))loadMore()});
$('themeBtn').addEventListener('click',()=>{state.theme=state.theme==='system'?'light':state.theme==='light'?'dark':'system';save();render()});
document.addEventListener('change',ev=>{if(ev.target.id==='themeSelect'){state.theme=ev.target.value;save();render()}if(ev.target.id==='importFile'){const f=ev.target.files[0];if(!f)return;f.text().then(t=>{let v=JSON.parse(t);if(!v||!Array.isArray(v.bookmarks)||!Array.isArray(v.seenNormal)||!Array.isArray(v.seenEasy)||!Array.isArray(v.posts)||typeof v.events!=='object')throw Error('Invalid save file');if(!confirm('Restore saved progress from this file? Current local progress will be replaced.'))return;stopTracking();state=v;save();session=[];setTab('feed');if(posts().some(p=>!seen().includes(p.id)))loadMore()}).catch(()=>alert('Could not import save file.'))}});
async function init(){try{const files=await Promise.all(['posts.json','posts-easy.json','users.json','events.json'].map(async f=>{const res=await fetch('./'+f,{cache:'no-store'});if(!res.ok)throw Error(f+' HTTP '+res.status);return res.json()}));[normal,easy]=files.slice(0,2).map(f=>f.posts);users=files[2].users;events=files[3];if(!Array.isArray(normal)||!Array.isArray(easy)||!Array.isArray(users))throw Error('Invalid file format');if(new Set([...normal,...easy].map(p=>p.id)).size!==normal.length+easy.length)throw Error('Duplicate post IDs');save();if(posts().some(p=>!seen().includes(p.id)))loadMore();else render()}catch(e){$('main').innerHTML=`<div class="error"><b>Could not load Chirp English data.</b><p>Upload all 5 files into the same GitHub folder.</p>${esc(e.message)}</div>`}}
init();
</script></body></html>
