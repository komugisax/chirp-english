/* v4.1: keep every post within the same readable mobile gutter. */
html,body,.app,#main{width:100%;max-width:100%;min-width:0;overflow-x:clip}
.app{max-width:720px}
#main>*,.post,.chapter,.event,.card,.translation,.text,.reply,.msg{min-width:0;max-width:100%}
.post{padding-inline:15px;overflow-wrap:anywhere}
.chapter .post{margin:10px 0 0;border:1px solid var(--line);border-radius:12px}
.chapter{padding-inline:15px}
.author-btn,.author-name,.handle,.list-row,.person,.msg,.smallcap{overflow-wrap:anywhere}
.titlebar>div:first-child{min-width:0}
.controls{flex-shrink:0}
.pinned-head{padding:8px 15px 0;color:var(--muted);font-size:12px;font-weight:700}
.feed-heading{padding:13px 15px 8px;font-size:13px;color:var(--muted);font-weight:700;border-bottom:1px solid var(--line)}

/* v4.3: consistent card gutters and clipping in every tab and nested thread. */
#main{min-width:0;width:100%;overflow-x:clip}
#main .post{width:calc(100% - 28px);max-width:calc(100% - 28px);margin:10px 14px; padding:14px; border:1px solid var(--line);border-radius:14px;overflow:hidden;contain:layout;}
#main .chapter .post{width:100%;max-width:100%;margin:10px 0 0;}
#main .reply{width:100%;max-width:100%;margin:0;overflow-wrap:anywhere;}
#main .event{width:calc(100% - 28px);max-width:calc(100% - 28px);margin:12px 14px;overflow-wrap:anywhere;}
#main .chapter-head,#main .feed-heading,#main .hint,#main .pinned-head{padding-left:15px;padding-right:15px;}
#main .author,#main .author-btn,#main .text,#main .translation,#main .actions,#main .replies,#main .msg,#main .card{min-width:0;max-width:100%;overflow-wrap:anywhere;}
#main .replies{overflow:hidden;}
#main .author-btn{overflow:hidden;}
#main .author-name,#main .handle{overflow-wrap:anywhere;}
#main .card{overflow:hidden;}
.avatar-picker{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin:9px 0 15px}
.avatar-option{display:grid;place-items:center;min-width:0;aspect-ratio:1;border:2px solid transparent;border-radius:12px;background:var(--bg);font-size:25px;color:var(--fg);padding:4px}

@media(max-width:340px){.avatar-picker{gap:4px}}

   map supplies an index in the reply argument, making post #2+ render as replies. */

#main article.post .text{white-space:pre-wrap;overflow-wrap:anywhere}
#main article.post .actions{display:flex;flex-wrap:wrap;min-width:0}

</style></head><body><div class="app"><header class="top"><div class="titlebar"><div><h1>🐦 Chirp English</h1><div class="subtitle">A tiny world in English · Ver.4.3 · Living World</div></div><div class="controls"><button id="levelBtn" class="tinyBtn" title="Reading level">🌱 Easy</button><button id="themeBtn" class="tinyBtn" title="Change color theme">◐ Auto</button></div></div></header><div class="fiction-banner">🎭 Fictional world · All news, weather, places and characters are invented. Not live information.</div><main id="main"><div class="empty">Loading your little world…</div></main><nav class="tabs" id="tabs"><button data-tab="feed" class="active"><b>⌂</b>Feed</button><button data-tab="dm"><b>✉</b>DMs</button><button data-tab="bookmarks"><b>♧</b>Saved</button><button data-tab="world"><b>🌍</b>Stories</button><button data-tab="people"><b>☺</b>People</button><button data-tab="stats"><b>▥</b>Stats</button></nav></div>
<script>
'use strict';
const KEY='chirp-english-v3', OLD='chirp-english-v2',BATCH=7;
const $=id=>document.getElementById(id);
function read(key){try{return JSON.parse(localStorage.getItem(key)||'null')}catch{return null}}
const v2=read(OLD)||{};
let state=read(KEY)||{seenNormal:Array.isArray(v2.seen)?v2.seen:[],seenEasy:[],bookmarks:Array.isArray(v2.bookmarks)?v2.bookmarks:[],level:'normal',theme:'system',displayName:'Your Name',posts:[],events:{},tags:[],version:3};
for(const k of ['seenNormal','seenEasy','bookmarks','posts','tags'])if(!Array.isArray(state[k]))state[k]=[];
if(!state.events||typeof state.events!=='object')state.events={};
const AVATAR_ICONS=['🐱','🐶','🐰','🦊','🐻','🐧','👽','🎷','🌸','☕','⭐','🍀','🎻','🎸','🎮','📚','🌈','🦉'];
const AVATAR_COLORS=['#F4B6C2','#E7C4FA','#B8DBF5','#B8E4CC','#FFE19A','#F3C5A6','#CBD1DF','#BBCAC0'];
function normalizeAvatar(){if(!AVATAR_ICONS.includes(state.avatarIcon))state.avatarIcon='🐱';if(!AVATAR_COLORS.includes(state.avatarColor))state.avatarColor='#E7C4FA'}
normalizeAvatar();
if(![0,2,4].includes(state.bodyPlus))state.bodyPlus=0;
if(!state.dmRead||typeof state.dmRead!=='object')state.dmRead={};
if(!state.livingWorld||typeof state.livingWorld!=='object')state.livingWorld={day:1,lastVisit:'',reveal:{},votes:{}};
if(!state.livingWorld.reveal||typeof state.livingWorld.reveal!=='object')state.livingWorld.reveal={};
if(!state.livingWorld.votes||typeof state.livingWorld.votes!=='object')state.livingWorld.votes={};if(!state.livingWorld.revisitSeen)state.livingWorld.revisitSeen={};
let feedObserver=null,viewTimers=new Map();
let returnToFeed=null;
let normal=[],easy=[],users=[],events={},stories={arcs:[]},ambient=[],world={},moods={categories:[]},worldArchive=false,tab='feed',profileId=null,session=[],unfold=new Set(),translations=new Set(),selectedEvent=null,selection=null,timer=null,seenLoaded=false;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){console.warn('Local storage unavailable',e)}};
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const user=name=>users.find(u=>u.name===name)||{id:'unknown',name,avatar:'💬',color:'#d9e2eb',handle:'@'+name.toLowerCase().replace(/\W+/g,'_'),bio:'',location:''};
const posts=()=>state.level==='easy'?easy:normal; const seen=()=>state.level==='easy'?state.seenEasy:state.seenNormal;
const byId=id=>[...normal,...easy,...allStoryPosts(),...ambient,...state.posts].find(p=>p.id===id);
const who=(name,size='')=>{const u=(name==='Your Name')?{avatar:state.avatarIcon,color:state.avatarColor}:user(name);return `<span class="avatar ${size}" style="background:${esc(u.color)}" aria-hidden="true">${esc(u.avatar)}</span>`};
const author=(name,click=true)=>{const u=user(name);return `<div class="author">${who(name)}<button class="author-btn" ${click?`data-person="${esc(u.id)}"`:''}><span class="author-name">${esc(u.name)}${isInstitution(u.name)?'<span class="official-label">Fictional org</span>':''}</span><span class="handle">${esc(u.handle)}</span></button></div>`};
function postCard(p,reply=false){const id=p.id,tr=translations.has(id),open=unfold.has(id),saved=state.bookmarks.includes(id),r=p.replies||[];const living=isLiving(p);const visible=living&&state.livingWorld.reveal[id]?r.filter(q=>Date.now()>=state.livingWorld.reveal[id]+(q.delay||0)):living?[]:r;const text=state.level==='easy'&&p.easyText?p.easyText:p.text;return `<article class="${reply?'reply':'post'}" ${reply?'':`data-feed-post="${esc(id)}"`}>${author(p.author)}${living?'<div class="smallcap" style="margin-top:7px">'+(p.id.startsWith('s4-')?'📖 STORY':'🌍 LOCAL LIFE')+'</div>':''}<div class="text">${esc(text)}</div>${tr?`<div class="translation" lang="ja">${esc(p.translation)}</div>`:''}<div class="actions"><button class="action ${tr?'active':''}" data-action="translate" data-id="${esc(id)}" aria-label="${tr?'Hide':'Show'} translation"><span class="sym">🌐</span><span>${tr?'Hide':'Translate'}</span></button>${reply?'':`<button class="action ${open?'active':''}" data-action="replies" data-id="${esc(id)}" aria-label="View replies"><span class="sym">💬</span>${visible.length}${living&&visible.length<r.length?' / '+r.length:''}</button><button class="action ${saved?'active':''}" data-action="bookmark" data-id="${esc(id)}" aria-label="Bookmark post" aria-pressed="${saved}"><span class="sym">${saved?'🔖':'♧'}</span><span>${saved?'Saved':'Save'}</span></button>`}</div>${!reply&&p.id==='s4-rosie07'?pollHTML():''}${!reply&&open?`<div class="replies">${visible.map((q,i)=>postCard({...q,text:state.level==='easy'&&q.easyText?q.easyText:q.text,id:q.id||id+'-r'+i},true)).join('')||'<div class="small muted">Replies are on the way…</div>'}</div>`:''}</article>`}

function shuffle(a){const result=[...a];for(let i=result.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[result[i],result[j]]=[result[j],result[i]]}return result}
function loadMore(){const queued=new Set(session);const candidates=posts().filter(p=>!seen().includes(p.id)&&!queued.has(p.id)).reverse();for(const p of candidates.slice(0,BATCH))session.push(p.id);render()}
// A post becomes seen after it is at least 60% visible for 1.2 continuous seconds.
// Neither preloading nor opening a profile/bookmark marks a post as seen.
function stopTracking(){if(feedObserver){feedObserver.disconnect();feedObserver=null}for(const t of viewTimers.values())clearTimeout(t);viewTimers.clear()}
function postActuallyVisible(el){if(document.visibilityState!=='visible'||tab!=='feed'||selectedEvent)return false;const r=el.getBoundingClientRect(),header=document.querySelector('.top'),nav=document.querySelector('.tabs');const top=header?header.getBoundingClientRect().bottom:0,bottom=nav?nav.getBoundingClientRect().top:innerHeight;const visible=Math.max(0,Math.min(r.bottom,bottom)-Math.max(r.top,top));return visible/Math.max(1,r.height)>=.6}
function trackFeed(){stopTracking();if(tab!=='feed'||selectedEvent)return;feedObserver=new IntersectionObserver(entries=>{for(const entry of entries){const el=entry.target,id=el.dataset.feedPost;if(!id||seen().includes(id))continue;if(entry.intersectionRatio>=.6&&postActuallyVisible(el)){if(!viewTimers.has(id)){const level=state.level;viewTimers.set(id,setTimeout(()=>{viewTimers.delete(id);if(level!==state.level||!el.isConnected||!postActuallyVisible(el)||seen().includes(id))return;seen().push(id);save();feedObserver?.unobserve(el)},1200))}}else if(viewTimers.has(id)){clearTimeout(viewTimers.get(id));viewTimers.delete(id)}}},{threshold:[0,.6,1]});document.querySelectorAll('#main [data-feed-post]').forEach(el=>{if(!seen().includes(el.dataset.feedPost))feedObserver.observe(el)})}
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopTracking();else trackFeed()});

const seenTotal=()=>new Set([...state.seenEasy,...state.seenNormal]).size;
function talkCount(name){return Object.values(state.events).filter(v=>v.done&&v.author===name).length+state.posts.filter(p=>(p.responses||[]).some(r=>r.author===name)).length}
function eventsReady(){return (events.events||[]).filter(e=>!state.events[e.id]&&seenTotal()>=e.minSeen&&talkCount(e.author)>=e.minTalk&&(!e.requires||state.events[e.requires]?.done))}
function unreadDM(){return eventList('dm').some(e=>!state.dmRead[e.id]&&!state.events[e.id]?.done)}
function eventList(kind){return (events.events||[]).filter(e=>e.kind===kind&&(state.events[e.id]||eventsReady().some(x=>x.id===e.id)))}
function eventHTML(e){const v=state.events[e.id],done=!!v?.done;const show=selectedEvent===e.id;return `<div class="event">${author(e.author)}<div class="text">${esc(state.level==='easy'?(e.easyPrompt||e.prompt):e.prompt)}</div><button class="tinyBtn" data-action="eventtranslation" data-id="${esc(e.id)}">🌐 ${translations.has(e.id)?'Hide translation':'Show translation'}</button>${translations.has(e.id)?`<div class="translation">${esc(e.translation)}</div>`:''}${done?`<div class="msg mine">${esc(state.level==='easy'?(e.choices[v.index]?.easyEn||e.choices[v.index]?.en||''):(e.choices[v.index]?.en||''))}</div><div class="msg">${esc(state.level==='easy'?(e.choices[v.index]?.easyAnswer||e.choices[v.index]?.answer||''):(e.choices[v.index]?.answer||''))}</div>${translations.has(e.id)?`<div class="translation">${esc(e.choices[v.index]?.answerJa||'')}</div>`:''}`:show?choiceHTML(e):`<button class="btn secondary" style="display:block;margin-top:12px" data-action="start-event" data-id="${esc(e.id)}">${e.kind==='dm'?'Open message':e.kind==='special'?'Join special story':'Join conversation'} →</button>`}</div>`}
function choiceHTML(e){return `<div class="note">Choose your reply · Tap 🌐 for a translation</div>${e.choices.map((c,i)=>`<div><button class="choice ${selection===i?'sel':''}" data-action="choose" data-index="${i}">${esc(state.level==='easy'?(c.easyEn||c.en):c.en)} ${selection===i?'✓':''}</button><button class="tinyBtn" data-action="choicetrans" data-id="${esc(e.id)}-${i}">🌐</button>${translations.has(e.id+'-'+i)?`<div class="choice-ja">${esc(c.ja)}</div>`:''}</div>`).join('')}<button class="btn" style="margin-top:13px" data-action="confirm-event" data-id="${esc(e.id)}" ${selection===null?'disabled':''}>Send reply</button> <button class="btn secondary" data-action="cancel-event">Later</button>`}
// Living World: authored fictional data, never generated by a live news or weather service.
const orgNames=new Set(['The Chirp Times','Chirp Weather','Bellport Transit',"What’s On Bellport",'Happy Paws Shelter',"Rosie's Kitchen"]);
const isInstitution=name=>orgNames.has(name);
const isLiving=p=>String(p.id||'').startsWith('s4-')||String(p.id||'').startsWith('a4-');
const allStoryPosts=()=>stories.arcs.flatMap(a=>a.episodes);
function worldDay(){return state.livingWorld.day||1}
function visitDay(){const local=new Date();const d=local.getFullYear()+'-'+String(local.getMonth()+1).padStart(2,'0')+'-'+String(local.getDate()).padStart(2,'0');const v=state.livingWorld;if(v.lastVisit!==d){if(v.lastVisit&&v.lastVisit<d)v.day=(v.day||1)+1;v.lastVisit=d;save()}}
function availableChapters(){const d=worldDay();return stories.arcs.flatMap(a=>a.episodes.map((p,i)=>({p,arc:a,index:i,unlock:a.startDay+i*a.everyDays})).filter(x=>x.unlock<=d)).sort((a,b)=>a.unlock-b.unlock)}
function season(){const m=new Date().getMonth()+1;return m>=3&&m<=5?'spring':m>=6&&m<=8?'summer':m>=9&&m<=11?'autumn':'winter'}
function part(){const h=new Date().getHours();return h<6?'night':h<11?'morning':h<14?'lunch':h<17?'afternoon':h<21?'evening':'night'}
function dailyAmbient(){const seasonName=season(),day=worldDay(),slot=part();const candidates=ambient.filter(p=>(p.season==='all'||p.season===seasonName)&&(!p.minWorldDay||worldDay()>=p.minWorldDay));const score=p=>([...p.id].reduce((n,c)=>n+c.charCodeAt(0),0)+day*7)%17;return [...candidates].sort((a,b)=>{const aa=a.daypart===slot?0:a.daypart==='any'?1:2,bb=b.daypart===slot?0:b.daypart==='any'?1:2;return aa-bb||score(a)-score(b)}).slice(0,4)}
function startReveal(p){if(!isLiving(p))return;if(!state.livingWorld.reveal[p.id]){state.livingWorld.reveal[p.id]=Date.now();save()}}
function startShown(){if(tab!=='feed'&&tab!=='world'&&tab!=='bookmarks'&&tab!=='people')return;document.querySelectorAll('[data-feed-post]').forEach(el=>{const p=byId(el.dataset.feedPost);if(p&&isLiving(p))startReveal(p)})}
function pollHTML(){const opts=[['curry','Spicy curry!','スパイシーカレー！'],['pancakes','Chocolate pancakes!','チョコレートパンケーキ！']];const vote=state.livingWorld.votes['rosie-menu'];return `<div class="poll"><strong class="small">🍳 Help Rosie choose!</strong><p class="small">${vote?'Your vote: '+esc(opts.find(x=>x[0]===vote)?.[1]||vote):'Pick a menu idea (fictional choice).'}</p>${opts.map(o=>`<button class="tinyBtn" data-action="world-vote" data-id="${o[0]}" ${vote?'disabled':''}>${esc(o[1])}</button>${translations.has('poll-'+o[0])?`<span class="small">${o[2]}</span>`:''}<button class="tinyBtn" data-action="choicetrans" data-id="poll-${o[0]}">🌐</button>`).join('')} ${vote?'<p class="small">Rosie: Thanks for voting! 💕</p>':''}</div>`}
function replyRevisits(){const now=Date.now(),all=[...availableChapters().map(x=>x.p),...dailyAmbient()];const items=[];for(const p of all){const start=state.livingWorld.reveal[p.id];if(!start||!p.replies?.length)continue;const visible=p.replies.filter(r=>now>=start+(r.delay||0));if(visible.length&&!state.livingWorld.revisitSeen?.[p.id]&&now-start>=Math.max(12000,p.replies[0].delay||0))items.push(p)}return items.slice(-2).reverse()}
function livingSection(){const all=availableChapters();const latest=all.slice(-2).reverse();const ambientPosts=dailyAmbient();return `<div class="chapter"><div class="chapter-title"><strong>🌍 Latest around town · Day ${worldDay()}</strong><span class="pill">New → Old</span></div><div class="small muted">Recent fictional activity appears first. Your story advances on days you visit.</div></div><div class="chapter-head"><strong class="small">🌤️ ${esc(part())} / ${esc(season())}</strong><button class="tinyBtn" data-action="go-world">See all →</button></div>${ambientPosts.slice(0,2).map(p=>postCard(p)).join('')}${latest.map(x=>`<div class="chapter-head"><strong class="small">${esc(x.arc.name)} · Part ${x.index+1}</strong><span class="pill">Story day ${x.unlock}</span></div>${postCard(x.p)}`).join('')}`}

function renderWorld(){const chapters=availableChapters(),recent=worldArchive?chapters.slice().reverse():chapters.slice(-4).reverse();const grouped=stories.arcs.map(a=>({arc:a,done:chapters.filter(x=>x.arc.id===a.id).length}));return `<div class="pad"><h2 class="heading">📖 Stories</h2><p class="small muted">Follow the fictional stories and revisit earlier chapters. Chapters unlock in order, even if you take a break.</p><div class="card"><strong>📅 Story day ${worldDay()}</strong><div class="small muted">Your story moves forward on days you return. Missed days do not skip episodes.</div></div>${grouped.map(g=>`<div class="card"><strong>${esc(g.arc.name)}</strong><p class="small muted">${esc(g.arc.intro||'')} · ${g.done} / ${g.arc.episodes.length} parts available</p></div>`).join('')}<button class="tinyBtn" data-action="world-archive">${worldArchive?'Show recent':'Show all unlocked chapters'} (${chapters.length})</button></div>${recent.map(x=>`<div class="chapter-head"><strong class="small">${esc(x.arc.name)} · Part ${x.index+1}</strong><span class="pill">Day ${x.unlock}</span></div>${postCard(x.p)}`).join('')}`}

function renderFeed(){const list=session.map(byId).filter(Boolean);const queued=new Set(session);const remaining=posts().filter(p=>!seen().includes(p.id)&&!queued.has(p.id)).length;const active=eventsReady().filter(e=>e.kind==='timeline'||e.kind==='special'||e.kind==='group');return `<div class="hint">${state.level==='easy'?'🌱 Short English, real conversations.':'🐦 Small stories from a fictional world.'} Tap 🌐 to translate.</div>${state.posts.length===0?`<div class="card" style="margin:12px 15px"><strong>👋 New here?</strong><p class="small muted">Choose your first post and meet a few neighbors.</p><button class="btn" data-action="intro">Write your first post →</button></div>`:''}${active.length?`<div class="pinned-head">📌 Conversations waiting for you · optional</div>${active.slice(0,2).map(eventHTML).join('')}`:''}${state.posts.slice().reverse().map(p=>playerPost(p)).join('')}${replyRevisits().map(p=>`<div class="revisit-label">💬 New replies to an earlier post <button class="tinyBtn" data-action="dismiss-revisit" data-id="${esc(p.id)}">Got it ✓</button></div><div class="resurfaced-post">${postCard(p)}</div>`).join('')}${livingSection()}<div class="feed-heading">📚 Earlier posts · newest first (original archive order)</div>${list.map(p=>postCard(p)).join('')}${remaining?`<button class="btn wide" data-action="more">Load more · ${remaining} unseen</button>`:`<div class="empty">${posts().some(p=>!seen().includes(p.id))?'Scroll to read the loaded posts.':'All caught up! 🎉<br>New posts can be added to JSON.'}</div>`}${state.posts.length?`<div class="pad"><button class="btn secondary" data-action="newpost">✎ Choose another post</button></div>`:''}`}
function playerPost(p){const visible=p.responses.filter(r=>Date.now()>=p.created+r.delay);return `<article class="post">${who('Your Name')}<strong style="margin-left:8px">${esc(state.displayName||'Your Name')}</strong> <span class="muted small">@yourname</span><div class="text">${esc(p.text)}</div><div class="small muted">💬 ${visible.length} / ${p.responses.length} replies</div>${visible.length?`<div class="replies">${visible.map(r=>`<div class="reply">${author(r.author)}<div class="text">${esc(r.text)}</div>${translations.has(r.id)?`<div class="translation">${esc(r.translation)}</div>`:''}<button class="tinyBtn" data-action="translate" data-id="${esc(r.id)}">🌐 ${translations.has(r.id)?'Hide translation':'Translate'}</button></div>`).join('')}</div>`:''}</article>`}
function renderDM(){const list=eventList('dm');const extra=(events.events||[]).filter(e=>(e.kind==='special'||e.kind==='group')&&state.events[e.id]);return `<div class="pad"><h2 class="heading">✉ Messages</h2><p class="muted small">Fictional friends may message you as you explore.</p>${[...list,...extra].map(eventHTML).join('')||'<div class="empty">No messages yet. Read some posts and join conversations!</div>'}</div>`}
function renderSaved(){const items=state.bookmarks.map(byId).filter(Boolean).reverse();return `<div class="pad"><h2 class="heading">🔖 Bookmarks</h2><p class="small muted">Saved posts stay here, even after you read them.</p></div>${items.map(p=>postCard(p)).join('')||'<div class="empty">Nothing saved yet.</div>'}`}
function renderPeople(){if(profileId){const u=users.find(x=>x.id===profileId);if(!u)return '';const ps=[...normal,...easy].filter(p=>p.author===u.name),reps=[...normal,...easy].flatMap(p=>(p.replies||[]).filter(r=>r.author===u.name).map(r=>({...r,source:p.text})));return `<button class="back" data-action="back-people">← All people</button><div class="pad"><div class="card" style="border-top:9px solid ${esc(u.color)}">${who(u.name)}<h2 class="heading">${esc(u.name)}</h2><div class="muted">${esc(u.handle)} · ${esc(u.location)}</div><p class="bio">${esc(u.bio)}</p><p class="small muted">${ps.length} posts · ${reps.length} replies</p></div><h3>Past posts</h3></div>${ps.map(p=>postCard(p)).join('')||'<div class="empty">No posts yet.</div>'}<div class="pad"><h3>Replies by ${esc(u.name)}</h3>${reps.slice(0,30).map(r=>`<div class="card">${esc(r.text)}<div class="small muted">Reply to: ${esc(r.source.slice(0,90))}…</div><button class="tinyBtn" data-action="translate" data-id="${esc(r.id)}">🌐 ${translations.has(r.id)?esc(r.translation):'Translate'}</button></div>`).join('')||'<div class="muted">No replies yet.</div>'}</div>`}return `<div class="pad"><h2 class="heading">☺ People</h2><p class="small muted">Meet the fictional people behind your feed.</p><div class="people">${users.map(u=>`<button class="person" data-person="${esc(u.id)}">${who(u.name)}<strong>${esc(u.name)}</strong><small>${esc(u.location)}</small></button>`).join('')}</div></div>`}
function renderStats(){let n=normal.length,e=easy.length,sn=normal.filter(p=>state.seenNormal.includes(p.id)).length,se=easy.filter(p=>state.seenEasy.includes(p.id)).length;let total=state.level==='easy'?e:n,shown=state.level==='easy'?se:sn;return `<div class="pad"><h2 class="heading">▥ Your Feed Stats</h2><div class="stats"><div class="card"><strong>${total}</strong><span class="small muted">Total</span></div><div class="card"><strong>${shown}</strong><span class="small muted">Seen</span></div><div class="card"><strong>${total-shown}</strong><span class="small muted">Unseen</span></div></div><div class="card"><strong>${state.level==='easy'?'🌱 Easy':'🐦 Normal'} progress</strong><div class="bar" style="margin:12px 0"><i style="width:${total?Math.round(shown/total*100):0}%"></i></div><span class="small muted">${shown} / ${total} read</span></div><div class="card"><h3>Reading history</h3><p class="small muted">A post counts as seen only after 1.2 seconds on screen. Resetting clears only the seen marks; bookmarks, your posts and friendships stay saved. The original v3 seen history may include posts you only loaded.</p><button class="btn secondary" data-action="reset-seen">Reset ${state.level==='easy'?'Easy':'Normal'} seen only</button></div><div class="card"><h3>Profile</h3><p class="small muted">Name is saved on this device. Your ID stays @yourname.</p><label for="playername">Display name</label><input class="field" id="playername" maxlength="30" value="${esc(state.displayName||'Your Name')}"><button class="btn secondary" style="margin-top:8px" data-action="save-name">Save name</button></div><div class="card"><h3>My avatar 🎨</h3><p class="small muted">Pick an icon and background color. Your choice appears beside your posts and stays on this device.</p><div class="avatar-preview">${who('Your Name')}<div><strong>${esc(state.displayName||'Your Name')}</strong><div class="small muted">@yourname</div></div></div><strong class="small">Icon</strong><div class="avatar-picker">${AVATAR_ICONS.map((i,n)=>`<button class="avatar-option ${state.avatarIcon===i?'selected':''}" type="button" data-action="avatar-icon" data-index="${n}" aria-label="Select avatar ${n+1}" aria-pressed="${state.avatarIcon===i}">${i}</button>`).join('')}</div><strong class="small">Background color</strong><div class="avatar-picker" style="grid-template-columns:repeat(8,minmax(0,1fr))">${AVATAR_COLORS.map((c,n)=>`<button class="avatar-option avatar-color ${state.avatarColor===c?'selected':''}" type="button" style="background:${c}" data-action="avatar-color" data-index="${n}" aria-label="Select color ${n+1}" aria-pressed="${state.avatarColor===c}">${state.avatarColor===c?'✓':''}</button>`).join('')}</div></div><div class="card"><h3>Appearance</h3><label for="themeSelect">Color mode</label><select class="field" id="themeSelect"><option value="system" ${state.theme==='system'?'selected':''}>System</option><option value="light" ${state.theme==='light'?'selected':''}>Light</option><option value="dark" ${state.theme==='dark'?'selected':''}>Dark</option></select><p class="small muted">Your theme and reading level stay saved in this browser.</p></div><div class="card"><h3>Post body text size 🔤</h3><p class="small muted">Only the main post text changes (not replies or buttons).</p><div class="world-control">${[0,2,4].map(v=>`<button class="tinyBtn" data-action="body-size" data-index="${v}" aria-pressed="${state.bodyPlus===v}">${v?'+'+v+'px':'Standard'}${state.bodyPlus===v?' ✓':''}</button>`).join('')}</div></div><div class="card"><h3>Save your progress</h3><button class="btn secondary" data-action="export">Export save data</button> <label class="tinyBtn" for="importFile" style="display:inline-block">Import save data</label><input type="file" id="importFile" accept="application/json,.json" style="position:absolute;width:1px;height:1px;opacity:0"><p class="small muted">Back up your choices, bookmarks and reading history. Local browser data may be erased by Safari.</p></div><div class="card"><h3>About · Ver.4.3</h3><p class="small muted"><strong>Fictional world disclosure:</strong> All characters, organizations, stores, cities, posts, news reports, incidents, weather forecasts and events are imaginary. Not real-world news, forecasts, official agencies or live information. Content is prewritten, with AI assistance; no live AI or real social network.</p><p class="small muted">v3 includes ${n} Normal posts and ${e} Easy posts. Old v2 bookmarks and reading history are imported on first use.</p></div></div>`}
function renderIntro(){const e=events.intro;return `<div class="pad"><h2 class="heading">✎ Your first post</h2><p class="muted small">Choose an English post. The locals will reply one by one.</p><div class="card"><strong>💬 Daily feelings & everyday posts</strong><p class="small muted">Pick a short English phrase. Replies vary by character and time of day.</p>${moods.categories.map(g=>`<div style="margin:10px 0"><strong class="small">${esc(g.label)}</strong><div class="mood-options">${g.items.map(x=>`<button class="choice" data-action="mood-post" data-id="${esc(x.id)}">${esc(x.en)}</button>`).join('')}</div></div>`).join('')}</div><div class="smallcap">Or choose a welcome post:</div>${e.choices.map((c,i)=>`<div class="card"><button class="choice ${selection===i?'sel':''}" data-action="choose" data-index="${i}">${esc(state.level==='easy'?(c.easyEn||c.en):c.en)} ${selection===i?'✓':''}</button><button class="tinyBtn" data-action="choicetrans" data-id="intro-${i}">🌐</button>${translations.has('intro-'+i)?`<div class="choice-ja">${esc(c.ja)}</div>`:''}</div>`).join('')}<button class="btn" data-action="confirm-intro" ${selection===null?'disabled':''}>Post</button> <button class="btn secondary" data-action="cancel-event">Cancel</button></div>`}
function refreshButtons(){document.documentElement.style.setProperty('--body-plus',(state.bodyPlus||0)+'px');$('levelBtn').textContent=state.level==='easy'?'🌱 Easy':'🐦 Normal';$('themeBtn').textContent=state.theme==='dark'?'☾ Dark':state.theme==='light'?'☀ Light':'◐ Auto';if(state.theme==='system')document.documentElement.removeAttribute('data-theme');else document.documentElement.dataset.theme=state.theme;$('tabs').querySelectorAll('button').forEach(b=>{b.classList.toggle('active',b.dataset.tab===tab);if(b.dataset.tab==='dm'){b.querySelector('.dm-dot')?.remove();if(unreadDM()){const dot=document.createElement('span');dot.className='dm-dot';dot.setAttribute('aria-label','Unread messages');b.appendChild(dot)}}})}
function capturePlace(){
 const top=document.querySelector('.top')?.getBoundingClientRect().bottom||0;
 const nodes=[...document.querySelectorAll('#main [data-feed-post]')];
 const found=nodes.find(el=>el.getBoundingClientRect().bottom>top+3);
 return {y:window.scrollY,id:found?.dataset.feedPost||null,offset:found?found.getBoundingClientRect().top-top:0};
}
function restorePlace(place){
 if(!place)return;
 if(place.id){const el=[...document.querySelectorAll('#main [data-feed-post]')].find(el=>el.dataset.feedPost===place.id);
 if(el){const top=document.querySelector('.top')?.getBoundingClientRect().bottom||0;
 window.scrollTo({top:Math.max(0,window.scrollY+el.getBoundingClientRect().top-top-place.offset),behavior:'instant'});return}}
 window.scrollTo({top:place.y,behavior:'instant'});
}
function render(){const place=capturePlace();stopTracking();refreshButtons();$('main').innerHTML=selectedEvent==='intro'?renderIntro():tab==='feed'?renderFeed():tab==='dm'?renderDM():tab==='bookmarks'?renderSaved():tab==='people'?renderPeople():tab==='world'?renderWorld():renderStats();restorePlace(place);startShown();schedule();trackFeed()}
function setTab(t){stopTracking();tab=t;profileId=null;selectedEvent=null;selection=null;render();window.scrollTo({top:0,behavior:'instant'})}
function confirmEvent(e){if(selection===null)return;const c=e.choices[selection];state.events[e.id]={done:true,index:selection,author:e.author,at:Date.now()};if(c.tag&&!state.tags.includes(c.tag))state.tags.push(c.tag);selectedEvent=null;selection=null;save();render();if(returnToFeed){restorePlace(returnToFeed);returnToFeed=null}}
function createMoodPost(id){const m=moods.categories.flatMap(g=>g.items).find(x=>x.id===id);if(!m)return;const slot=part(),pool=(m.replies||[]).filter(r=>!r.when||r.when===slot||r.when==='any');const fallback=m.replies||[];const eligible=pool.length?pool:fallback;const start=eligible.length?Math.floor((Date.now()/60000)%eligible.length):0;const replies=eligible.slice(start).concat(eligible.slice(0,start)).slice(0,3).map((r,i)=>({...r,id:'temp-'+i,delay:5000+i*8000}));const now=Date.now(),postId='you-'+now;state.posts.push({id:postId,text:m.en,created:now,responses:replies.map((r,i)=>({...r,id:postId+'-r'+i}))});selectedEvent=null;selection=null;save();setTab('feed');if(returnToFeed){restorePlace(returnToFeed);returnToFeed=null}}
function postChoice(){if(selection===null)return;const c=events.intro.choices[selection],id='you-'+Date.now();state.posts.push({id,text:c.en,created:Date.now(),responses:c.responses.map((r,i)=>({...r,id:id+'-r'+i}))});if(c.topic&&!state.tags.includes(c.topic))state.tags.push(c.topic);selectedEvent=null;selection=null;save();setTab('feed');if(returnToFeed){restorePlace(returnToFeed);returnToFeed=null}}
function schedule(){if(timer)clearTimeout(timer);const next=state.posts.flatMap(p=>p.responses.map(r=>p.created+r.delay)).filter(t=>t>Date.now()).sort((a,b)=>a-b)[0];const livingNext=Object.entries(state.livingWorld.reveal).flatMap(([id,start])=>(byId(id)?.replies||[]).map(r=>start+(r.delay||0))).filter(t=>t>Date.now()).sort((a,b)=>a-b)[0];const target=Math.min(next||Infinity,livingNext||Infinity);if(Number.isFinite(target))timer=setTimeout(()=>{timer=null;render()},Math.max(100,target-Date.now()+80))}
document.addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;if(b.dataset.tab){setTab(b.dataset.tab);return}if(b.dataset.person){profileId=b.dataset.person;tab='people';selectedEvent=null;render();window.scrollTo(0,0);return}const a=b.dataset.action,id=b.dataset.id;
if(a==='dismiss-revisit'){state.livingWorld.revisitSeen[id]=true;save();render();return}if(a==='body-size'){state.bodyPlus=Number(b.dataset.index)||0;save();render();return}if(a==='avatar-icon'){const i=Number(b.dataset.index);if(AVATAR_ICONS[i]){state.avatarIcon=AVATAR_ICONS[i];save();render()}return}if(a==='avatar-color'){const i=Number(b.dataset.index);if(AVATAR_COLORS[i]){state.avatarColor=AVATAR_COLORS[i];save();render()}return}if(a==='go-world'){setTab('world');return}if(a==='world-archive'){worldArchive=!worldArchive;render();return}if(a==='world-vote'){if(!state.livingWorld.votes['rosie-menu']){state.livingWorld.votes['rosie-menu']=id;save()}render();return}if(a==='more'){loadMore();return}if(a==='reset-seen'){const label=state.level==='easy'?'Easy':'Normal';if(!confirm('Reset '+label+' reading history? Your bookmarks, posts and event progress will stay saved.'))return;if(state.level==='easy')state.seenEasy=[];else state.seenNormal=[];session=[];save();setTab('feed');loadMore();return}if(a==='translate'||a==='eventtranslation'||a==='choicetrans'){translations.has(id)?translations.delete(id):translations.add(id);render();return}if(a==='replies'){unfold.has(id)?unfold.delete(id):unfold.add(id);render();return}if(a==='bookmark'){state.bookmarks.includes(id)?state.bookmarks=state.bookmarks.filter(x=>x!==id):state.bookmarks.push(id);save();render();return}if(a==='back-people'){profileId=null;render();return}if(a==='mood-post'){createMoodPost(id);return}if(a==='intro'||a==='newpost'){returnToFeed=capturePlace();selectedEvent='intro';selection=null;render();window.scrollTo({top:0,behavior:'instant'});return}if(a==='choose'){selection=Number(b.dataset.index);render();return}if(a==='confirm-intro'){postChoice();return}if(a==='start-event'){returnToFeed=capturePlace();selectedEvent=id;selection=null;const opened=events.events.find(e=>e.id===id);if(opened?.kind==='dm'){state.dmRead[id]=true;save()}render();return}if(a==='confirm-event'){const e=events.events.find(x=>x.id===id);if(e)confirmEvent(e);return}if(a==='cancel-event'){selectedEvent=null;selection=null;render();if(returnToFeed){restorePlace(returnToFeed);returnToFeed=null}return}if(a==='save-name'){state.displayName=$('playername').value.trim().slice(0,30)||'Your Name';save();render();return}if(a==='export'){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='chirp-save.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1200);return}
});
