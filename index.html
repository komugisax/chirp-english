<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#10141a">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Chirp English</title>
<style>
:root{color-scheme:dark;--bg:#10141a;--panel:#181e27;--line:#2b3441;--fg:#f2f5f8;--muted:#a4b2c3;--accent:#81d8d0;--gold:#ffd08a}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.52}
button{font:inherit;cursor:pointer}button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.app{max-width:660px;margin:auto;min-height:100dvh;padding-bottom:calc(80px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;background:rgba(16,20,26,.95);backdrop-filter:blur(16px);z-index:5;border-bottom:1px solid var(--line);padding:12px 18px 10px}.brand{display:flex;justify-content:space-between;align-items:center}.brand h1{margin:0;font-size:21px;letter-spacing:-.6px}.brand small{display:block;color:var(--muted);font-size:11px}.bird{color:var(--accent)}.pill{background:#243c3c;color:#9af2dc;border-radius:20px;font-size:11px;padding:4px 9px;font-weight:700}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:660px;background:rgba(19,24,32,.97);z-index:10;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);padding:7px 6px calc(8px + env(safe-area-inset-bottom))}.nav button{background:none;border:0;color:var(--muted);padding:7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px}.nav button.active{color:var(--accent);font-weight:700}.nav svg{width:23px;height:23px}
.feedHint{padding:11px 17px;font-size:12px;color:var(--muted);background:#141b24;border-bottom:1px solid var(--line)}.post{border-bottom:1px solid var(--line);padding:18px 15px}.authorLine{display:flex;gap:10px;align-items:center}.avatar{width:43px;height:43px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:25px;background:#26313c}.identity{min-width:0;flex:1}.name{font-size:15px;font-weight:750}.handle{font-size:12px;color:var(--muted)}.category{color:var(--muted);font-size:11px;letter-spacing:.04em;text-transform:uppercase}.postText{font-size:16px;margin:12px 0;white-space:pre-wrap;overflow-wrap:anywhere}.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.action{background:transparent;border:1px solid #394554;color:#c3cedb;border-radius:22px;padding:7px 11px;font-size:12px}.action:hover{background:#26323c}.action.saved{color:var(--gold);border-color:#856943}.action.primary{color:var(--accent);border-color:#357774}.translation{margin:10px 0 12px;background:#202d36;border-left:3px solid var(--accent);border-radius:5px;padding:10px 12px;font-size:14px;line-height:1.7;color:#e8f7f5}.replies{margin-top:13px;border-left:2px solid #4a6d75;margin-left:19px;padding-left:14px}.reply{padding:11px 0;border-bottom:1px solid #2a3440}.reply:last-child{border:0}.reply .postText{font-size:14px;margin:7px 0}.reply .avatar{width:30px;height:30px;font-size:19px}.reply .name{font-size:13px}.reply .handle{font-size:11px}.reply .translation{font-size:13px}
.mainBtn{width:calc(100% - 30px);margin:15px;border:1px solid #3a7f7c;background:#244947;border-radius:13px;color:#bdf7ef;font-weight:700;padding:14px}.mainBtn:disabled{opacity:.45}.empty{text-align:center;padding:46px 25px;color:var(--muted)}.empty h2{color:var(--fg);font-size:19px}.sectionHeading{padding:19px 16px 5px;font-size:22px;margin:0}.sectionDesc{padding:0 16px 15px;margin:0;color:var(--muted);font-size:13px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:15px}.stat{background:var(--panel);border:1px solid var(--line);padding:13px 9px;border-radius:13px;text-align:center}.stat strong{display:block;font-size:24px}.stat span{font-size:11px;color:var(--muted)}.progressWrap{margin:18px 15px;background:var(--panel);padding:17px;border-radius:13px;border:1px solid var(--line)}.progressTrack{width:100%;height:11px;background:#35404c;border-radius:12px;overflow:hidden;margin:13px 0 8px}.progressFill{height:100%;background:var(--accent);transition:width .2s}.progressLabel{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:12px}.notice{background:#3a3225;color:#ffe2a9;margin:12px 15px;border-radius:12px;padding:13px;font-size:13px}.settings{margin:16px;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:16px;font-size:14px}.settings p{color:var(--muted)}.secondaryBtn{border:1px solid #526477;color:var(--fg);background:transparent;border-radius:10px;padding:10px 12px}.danger{color:#ffb2af;border-color:#985b58}.hidden{display:none!important}.error{margin:15px;padding:18px;background:#422c32;border-radius:12px;color:#ffd8db}footer{padding:22px;text-align:center;color:var(--muted);font-size:11px}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand"><div><h1><span class="bird">✦</span> Chirp English</h1><small>A tiny world in English</small></div><span class="pill">AI FICTION</span></div></header>
<div id="content"><div class="empty">Loading your little world…</div></div>
<nav class="nav" aria-label="Main navigation">
<button type="button" data-tab="feed" class="active"><span style="font-size:23px" aria-hidden="true">⌂</span>Feed</button>
<button type="button" data-tab="bookmarks"><span style="font-size:23px" aria-hidden="true">♧</span>Bookmarks</button>
<button type="button" data-tab="stats"><span style="font-size:23px" aria-hidden="true">▥</span>Stats</button>
</nav>
</div>
<script>
'use strict';
const KEY='chirp-english-v2';const BATCH=7;
let data=[], byId=new Map(),tab='feed',session=[],openedReplies=new Set(),translations=new Set();
function readSaved(){try{const v=JSON.parse(localStorage.getItem(KEY));return v&&typeof v==='object'?v:{}}catch{return {}}}
let state=readSaved();state.seen=Array.isArray(state.seen)?state.seen:[];state.bookmarks=Array.isArray(state.bookmarks)?state.bookmarks:[];
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){console.warn('Save unavailable',e)}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function icon(kind){return {bookmark:'🔖',reply:'💬',translate:'🌐'}[kind]||''}
function postHTML(p,reply=false){const id=p.id, t=translations.has(id),open=openedReplies.has(id),saved=state.bookmarks.includes(id),rs=p.replies||[];return `<article class="${reply?'reply':'post'}" data-post="${esc(id)}"><div class="authorLine"><div class="avatar" aria-hidden="true">${esc(p.avatar)}</div><div class="identity"><div class="name">${esc(p.author)}</div><div class="handle">@${esc(p.author.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/_$/,''))}</div></div>${reply?'':`<div class="category">${esc(p.category)}</div>`}</div><div class="postText">${esc(p.text)}</div>${t?`<div class="translation" lang="ja">${esc(p.translation)}</div>`:''}<div class="actions"><button type="button" class="action ${t?'primary':''}" data-action="translate" data-id="${esc(id)}" aria-expanded="${t}">${icon('translate')} ${t?'Hide translation':'Show translation'}</button>${!reply?`<button type="button" class="action" data-action="replies" data-id="${esc(id)}" aria-expanded="${open}" ${rs.length===0?'disabled':''}>${icon('reply')} ${open?'Hide replies':'View replies'} (${rs.length})</button><button type="button" class="action ${saved?'saved':''}" data-action="bookmark" data-id="${esc(id)}" aria-pressed="${saved}">${icon('bookmark')} ${saved?'Saved':'Bookmark'}</button>`:''}</div>${!reply&&open&&rs.length?`<div class="replies">${rs.map(r=>postHTML(r,true)).join('')}</div>`:''}</article>`}
function unreads(){return data.filter(p=>!state.seen.includes(p.id)&&!session.includes(p.id))}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function loadMore(){const candidates=shuffle(unreads());const items=candidates.slice(0,BATCH);items.forEach(p=>{session.push(p.id);if(!state.seen.includes(p.id))state.seen.push(p.id)});save();render()}
function renderFeed(){const remaining=unreads().length;const rendered=session.map(id=>byId.get(id)).filter(Boolean);return `<div class="feedHint">Made-up people. Real English. Tap to translate. ✨</div>${rendered.map(p=>postHTML(p)).join('')}${remaining>0?`<button class="mainBtn" data-action="load">Load more · ${remaining} unseen</button>`:rendered.length?`<div class="empty"><h2>You're all caught up! 🎉</h2><p>No unseen posts remain. Check Bookmarks or Stats for what to do next.</p></div>`:`<div class="empty"><h2>You've seen every post! 🎉</h2><p>More stories can be added to posts.json. You can also revisit your bookmarks.</p><button class="secondaryBtn" data-action="go-stats">See my stats</button></div>`}`}
function renderBookmarks(){const items=state.bookmarks.map(id=>byId.get(id)).filter(Boolean).reverse();return `<h2 class="sectionHeading">🔖 Bookmarks</h2><p class="sectionDesc">Your favorite posts, anytime. Replies stay attached.</p>${items.length?items.map(p=>postHTML(p)).join(''):`<div class="empty"><h2>No bookmarks yet</h2><p>Tap Bookmark on a post to save it here.</p></div>`}`}
function renderStats(){const seen=data.filter(p=>state.seen.includes(p.id)).length;const total=data.length;const unseen=total-seen;const pct=total?Math.round(seen/total*100):0;return `<h2 class="sectionHeading">📊 Your Feed Stats</h2><p class="sectionDesc">Your progress is saved on this device.</p><div class="stats"><div class="stat"><strong>${total}</strong><span>Total posts</span></div><div class="stat"><strong>${seen}</strong><span>Seen</span></div><div class="stat"><strong>${unseen}</strong><span>Unseen</span></div></div><div class="progressWrap"><strong>Library progress</strong><div class="progressTrack" role="progressbar" aria-label="Posts seen" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><div class="progressFill" style="width:${pct}%"></div></div><div class="progressLabel"><span>${seen} / ${total} posts seen</span><span>${pct}%</span></div></div>${unseen<=Math.ceil(total*.1)?`<div class="notice">✨ ${unseen===0?'All caught up!':'Refill soon!'} Add more stories to <b>posts.json</b> when you want. New IDs appear as unseen automatically.</div>`:''}<div class="settings"><b>📖 How it works</b><p>Posts are shown in a random order. Once shown, they won't return to your new-post feed. Bookmark favorites to reread them. Replies and translations open when you tap.</p><p>Your reading history and bookmarks are stored in this browser. Clearing Safari website data, or using another device, may erase or separate your progress.</p><button type="button" class="secondaryBtn danger" data-action="reset">Reset seen history</button><p style="font-size:12px">Reset makes all posts unseen again. Your bookmarks will stay saved.</p></div>`}
function render(){const el=document.getElementById('content');el.innerHTML=tab==='feed'?renderFeed():tab==='bookmarks'?renderBookmarks():renderStats();document.querySelectorAll('[data-tab]').forEach(b=>{b.classList.toggle('active',b.dataset.tab===tab);b.setAttribute('aria-current',b.dataset.tab===tab?'page':'false')})}
function switchTab(to){tab=to;render();window.scrollTo({top:0,behavior:'instant'})}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.tab){switchTab(b.dataset.tab);return}let a=b.dataset.action,id=b.dataset.id;if(a==='load'){loadMore();return}if(a==='translate'){translations.has(id)?translations.delete(id):translations.add(id);render();return}if(a==='replies'){openedReplies.has(id)?openedReplies.delete(id):openedReplies.add(id);render();return}if(a==='bookmark'){state.bookmarks.includes(id)?state.bookmarks=state.bookmarks.filter(x=>x!==id):state.bookmarks.push(id);save();render();return}if(a==='go-stats'){switchTab('stats');return}if(a==='reset'){if(confirm('Reset all seen history? Your bookmarks will remain.')){state.seen=[];session=[];save();switchTab('feed');loadMore()}}});
async function init(){try{const res=await fetch('./posts.json',{cache:'no-store'});if(!res.ok)throw Error('HTTP '+res.status);const parsed=await res.json();if(!Array.isArray(parsed.posts))throw Error('Invalid JSON structure');data=parsed.posts;byId=new Map(data.map(p=>[p.id,p]));if(byId.size!==data.length)throw Error('Duplicate post IDs');state.seen=state.seen.filter(id=>byId.has(id));state.bookmarks=state.bookmarks.filter(id=>byId.has(id));save();if(unreads().length)loadMore();else render()}catch(e){document.getElementById('content').innerHTML=`<div class="error"><b>Could not load posts.json</b><p>Please upload both <code>index.html</code> and <code>posts.json</code> to the same folder on GitHub Pages.</p><p>${esc(e.message)}</p></div>`}}
init();
</script>
</body>
</html>
