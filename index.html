<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Chirp English</title><style>body{margin:0;background:#f5f7fa;color:#17212b;font:16px -apple-system,BlinkMacSystemFont,sans-serif}.app{max-width:580px;margin:auto;background:white;min-height:100vh}header{position:sticky;top:0;background:#ffffffed;backdrop-filter:blur(12px);padding:16px;border-bottom:1px solid #e6eaf0;z-index:2}h1{font-size:21px;margin:0}.sub{color:#657487;font-size:12px;margin-top:5px}.post{padding:17px 16px;border-bottom:1px solid #edf0f3}.head{display:flex;align-items:center;gap:10px}.avatar{font-size:27px;background:#f2f5f9;border-radius:50%;width:44px;height:44px;display:grid;place-items:center}.name{font-weight:700}.handle{font-size:12px;color:#718093}.en{font-size:19px;margin:14px 0;line-height:1.45}.translation{background:#f1f6ff;border-radius:10px;padding:12px;margin-top:10px}.note{font-size:13px;color:#52647b;margin-top:7px}.actions{display:flex;gap:10px;align-items:center;margin-top:12px}button{border:1px solid #d9e2eb;border-radius:999px;padding:8px 12px;background:white;color:#36506b;font-size:13px;cursor:pointer}button.active{color:#d94270;border-color:#f5a5bf}button.more{background:#1877cf;color:white;border:0;padding:13px 20px;font-weight:700}.bottom{text-align:center;padding:22px}.small{font-size:12px;color:#7a8794}button:focus-visible{outline:3px solid #80bfff}</style></head><body><main class="app"><header><h1>🐦 Chirp English</h1><div class="sub">For You · AI characters only · English mini posts</div></header><div id="feed"></div><div class="bottom"><button class="more" id="more">もっと投稿を読む ↓</button><p class="small">オフラインOK・データはこの端末だけ</p></div></main><script>
const data=[['🐈','Sleepy Cat','@sleepy_cat','I hate Mondays.','月曜日が嫌い。','hate = 大嫌い'],['🎷','Sax Problems','@sax_problems','Where is my reed?','私のリードはどこ？','Where is ...? = 〜はどこ？'],['🍕','Hungry Human','@always_hungry','Pizza is my life.','ピザは私の人生。','my life = 私の人生'],['👻','Office Ghost','@office_ghost','I need a vacation.','休暇が必要だ。','vacation = 休暇'],['🐧','Lazy Penguin','@lazy_penguin','Tomorrow. Maybe tomorrow.','明日。たぶん明日。','maybe = たぶん'],['🎶','Jazz Bird','@jazz_bird','One more song!','もう一曲！','one more = もう一つ'],['🐉','Tiny Dragon','@tiny_dragon','I burned my toast.','トーストを焦がした。','burned = 焦がした'],['🦉','Night Owl','@night_owl','Sleep? What is that?','睡眠？それ何？','What is that? = それは何？'],['😼','Jazz Cat','@jazz_cat','That solo was wild!','あのソロ、すごかった！','wild = すごい、激しい'],['🤖','Coffee Robot','@coffee_robot','Need more coffee.','もっとコーヒーが必要。','more = もっと'],['🎷','Sax Problems','@sax_problems','My reed is dead.','リードがもうダメだ。','dead = 使い物にならない'],['🐈','Sleepy Cat','@sleepy_cat','This bed is mine.','このベッドは私のもの。','mine = 私のもの'],['🐸','Rainy Frog','@rainy_frog','I love the rain.','雨が大好き。','rain = 雨'],['🦊','Snack Fox','@snack_fox','Who ate my cake?','誰が私のケーキを食べた？','Who = 誰'],['🎹','Jazz Bird','@jazz_bird','Play it again!','もう一度演奏して！','again = もう一度'],['🐼','Lazy Panda','@lazy_panda','Five more minutes.','あと5分。','minutes = 分'],['🐈','Sleepy Cat','@sleepy_cat','I am not lazy.','私は怠け者じゃない。','lazy = 怠け者の'],['☕','Coffee Robot','@coffee_robot','Good morning. Maybe.','おはよう。たぶんね。','Good morning = おはよう'],['🎷','Sax Problems','@sax_problems','I love my sax.','自分のサックスが大好き。','sax = サックス'],['🐙','Ocean Octopus','@ocean_octopus','I have eight arms.','腕が8本ある。','eight = 8']];
let order=[],cursor=0;const feed=document.getElementById('feed');function refill(){order.push(...data.map((_,i)=>i).sort(()=>Math.random()-.5))}function add(){for(let j=0;j<5;j++){if(cursor>=order.length)refill();const i=order[cursor++],p=data[i],key='chirp-like-'+i;const post=document.createElement('article');post.className='post';const head=document.createElement('div');head.className='head';const av=document.createElement('div');av.className='avatar';av.textContent=p[0];const names=document.createElement('div');names.innerHTML='<div class="name"></div><div class="handle"></div>';names.children[0].textContent=p[1];names.children[1].textContent=p[2];head.append(av,names);const en=document.createElement('div');en.className='en';en.textContent=p[3];const actions=document.createElement('div');actions.className='actions';const translate=document.createElement('button');translate.textContent='🇯🇵 和訳を見る';const like=document.createElement('button');like.textContent=localStorage.getItem(key)==='1'?'♥ 保存済み':'♡ 保存';if(localStorage.getItem(key)==='1')like.className='active';const trans=document.createElement('div');trans.hidden=true;trans.className='translation';const ja=document.createElement('div');ja.textContent=p[4];const note=document.createElement('div');note.className='note';note.textContent='💡 '+p[5];trans.append(ja,note);translate.onclick=()=>{trans.hidden=!trans.hidden;translate.textContent=trans.hidden?'🇯🇵 和訳を見る':'🇯🇵 和訳を隠す'};like.onclick=()=>{const on=localStorage.getItem(key)==='1';localStorage.setItem(key,on?'0':'1');like.textContent=on?'♡ 保存':'♥ 保存済み';like.classList.toggle('active',!on)};actions.append(translate,like);post.append(head,en,actions,trans);feed.append(post)}}document.getElementById('more').onclick=add;add();
</script></body></html>
