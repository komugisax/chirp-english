<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#667C3E"><title>Little English Lab | Chirp English</title><style>
:root{color-scheme:light;--bg:#fff;--panel:#f3f6f9;--text:#1c2932;--sub:#52616c;--accent:#667c3e;--line:#dae3e7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:720px;margin:auto;padding:calc(17px + env(safe-area-inset-top,0px)) 16px calc(70px + env(safe-area-inset-bottom,0px))}a{color:var(--accent)}.back{display:inline-block;border:1px solid var(--line);padding:9px 12px;border-radius:12px;text-decoration:none;color:var(--text);font-weight:600;margin-bottom:14px}h1{font-size:25px;margin:4px 0}p{margin:6px 0 14px}h2{font-size:18px;margin:8px 0}.sub{color:var(--sub)}.filters{position:sticky;top:0;background:var(--bg);z-index:2;padding:12px 0;border-bottom:1px solid var(--line)}input,select{font:inherit;padding:12px;border-radius:11px;border:1px solid var(--line);background:var(--bg);color:var(--text);width:100%}select{margin-top:8px}.entry{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:16px;margin:13px 0;scroll-margin-top:150px}.entry h2{margin:0;font-size:19px}.tag{font-size:12px;color:var(--sub);font-weight:600}.example{padding:10px 12px;background:var(--bg);border-left:3px solid var(--accent);border-radius:6px;margin:10px 0 4px}.ja{color:var(--sub);font-size:13px}.entry a{display:inline-block;margin-top:9px;text-decoration:none;font-size:13px;font-weight:650}summary{cursor:pointer;font-weight:600}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent)}.count{font-size:12px;margin:8px 0;color:var(--sub)}@media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#10151d;--panel:#202b37;--text:#edf4fa;--sub:#b0bdc9;--line:#344353;--accent:#a6c87c}}</style></head><body><div class="app"><a class="back" href="./index.html">← Chirp English に戻る</a><h1>📚 Little English Lab</h1><p>住人たちの会話に登場する単語・熟語・文法をまとめました。すべての解説を最初から自由に読むことができます。</p><p class="sub">学習を強制するテストはありません。気になる言葉から、のんびり読んでみてください。</p><section class="filters"><label for="search">🔎 単語・意味・解説を検索</label><input id="search" type="search" placeholder="例：figure out、気になる、過去進行形"><label for="kind">カテゴリ</label><select id="kind"><option value="">すべて</option><option>単語</option><option>熟語</option><option>表現</option><option>文法</option></select><div id="count" class="count"></div></section><main id="entries"><p>読み込み中です…</p></main><footer class="sub">Chirp English · Fictional learning examples</footer></div><script>
'use strict';let data=[];const $=id=>document.getElementById(id),escapeText=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function draw(){const q=$('search').value.toLocaleLowerCase(),kind=$('kind').value;const list=data.filter(x=>(!kind||x.kind===kind)&&[x.term,x.meaning,x.note,x.example].join(' ').toLocaleLowerCase().includes(q));$('count').textContent=`${list.length} / ${data.length} 項目`;$('entries').innerHTML=list.map(x=>`<article class="entry" id="${escapeText(x.id)}"><div class="tag">${escapeText(x.kind)}</div><h2>${escapeText(x.term)}</h2><strong>${escapeText(x.meaning)}</strong><p>${escapeText(x.note)}</p><details><summary>💬 住人の会話での使い方を見る</summary><div class="example" lang="en">${escapeText(x.example)}</div><div class="ja">${escapeText(x.exampleJa)}</div><div class="tag">${escapeText(x.author)}</div><p><a href="./index.html?post=${encodeURIComponent(x.postId)}">この表現が出てきた投稿を見る →</a></p></details></article>`).join('')||'<p>該当する項目はありません。</p>';}Promise.all([fetch('./lab.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('lab.jsonが見つかりません');return r.json()})]).then(([d])=>{data=d.entries;draw();const hash=decodeURIComponent(location.hash.slice(1));if(hash){const el=document.getElementById(hash);if(el){el.scrollIntoView();el.querySelector('details')?.setAttribute('open','');}}}).catch(e=>{$('entries').textContent='解説を読み込めませんでした。ファイルを同じフォルダに配置してください。 '+e.message});$('search').addEventListener('input',draw);$('kind').addEventListener('change',draw);
</script></body></html>
